[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-framework"
version = "0.1.0"
description = "Multi-session AI Agent framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_framework*"]
exclude = ["logs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["agent-framework/tests", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"