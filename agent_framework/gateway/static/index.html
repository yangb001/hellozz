<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Framework</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #34495e;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .new-session-btn {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-session-btn:hover {
            background: #2980b9;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-item:hover {
            background: #34495e;
        }

        .session-item.active {
            background: #3498db;
        }

        .session-item .session-id {
            font-size: 13px;
            opacity: 0.8;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-item .session-time {
            font-size: 11px;
            opacity: 0.6;
        }

        /* Main Chat Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        #chatContent {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .chat-header {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 16px;
            color: #333;
        }

        .chat-header .session-info {
            font-size: 12px;
            color: #666;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            min-height: 0;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #3498db;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 4px;
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #3498db;
        }

        .send-btn {
            padding: 12px 24px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #2980b9;
        }

        .send-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            min-height: 0;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* Loading Indicator */
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            max-width: 70%;
        }

        .typing-indicator.active {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Status Bar */
        .status-bar {
            padding: 8px 20px;
            background: #ecf0f1;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-dot.connected { background: #2ecc71; }
        .status-dot.disconnected { background: #e74c3c; }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>AI Agent</h1>
            <button class="new-session-btn" onclick="createSession()">+ 新建会话</button>
        </div>
        <div class="session-list" id="sessionList">
            <!-- Sessions will be added here -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main">
        <div class="chat-header" id="chatHeader" style="display: none;">
            <h2 id="sessionTitle">会话</h2>
            <span class="session-info" id="sessionInfo"></span>
        </div>

        <div id="chatContent">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                </svg>
                <p>选择或创建一个会话开始对话</p>
            </div>
        </div>

        <div class="input-area" id="inputArea" style="display: none;">
            <div class="input-container">
                <input type="text" class="message-input" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <span><span class="status-dot disconnected" id="statusDot"></span><span id="statusText">未连接</span></span>
            <span id="messageCount">0 条消息</span>
        </div>
    </div>

    <script>
        // State
        let currentSessionId = null;
        let sessions = [];
        let ws = null;
        let isProcessing = false;

        // API Base URL
        const API_BASE = '/api/v1';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSessions();
        });

        // Load sessions from server (we'll store them locally for now)
        async function loadSessions() {
            // In a real app, we'd have a list sessions endpoint
            // For now, we'll use local storage
            const saved = localStorage.getItem('sessions');
            if (saved) {
                sessions = JSON.parse(saved);
                renderSessionList();
            }
        }

        // Save sessions to local storage
        function saveSessions() {
            localStorage.setItem('sessions', JSON.stringify(sessions));
        }

        // Create new session
        async function createSession() {
            try {
                const response = await fetch(`${API_BASE}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 'web_user',
                        session_type: 'private'
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to create session');
                }

                const data = await response.json();
                const session = {
                    id: data.session_id,
                    created_at: data.created_at,
                    type: data.session_type
                };

                sessions.unshift(session);
                saveSessions();
                renderSessionList();
                selectSession(session.id);
            } catch (error) {
                console.error('Error creating session:', error);
                alert('创建会话失败: ' + error.message);
            }
        }

        // Render session list
        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = sessions.map(session => `
                <div class="session-item ${session.id === currentSessionId ? 'active' : ''}"
                     onclick="selectSession('${session.id}')">
                    <span class="session-id">${session.id.substring(0, 8)}...</span>
                    <span class="session-time">${formatTime(session.created_at)}</span>
                </div>
            `).join('');
        }

        // Select session
        async function selectSession(sessionId) {
            currentSessionId = sessionId;

            // Reset processing state when switching sessions
            isProcessing = false;
            updateSendButton();
            hideTypingIndicator();
            finalizeStreaming();

            // Update UI
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'block';
            document.getElementById('sessionTitle').textContent = `会话 ${sessionId.substring(0, 8)}`;

            renderSessionList();
            await loadMessages();
            connectWebSocket();
        }

        // Load message history
        async function loadMessages() {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`${API_BASE}/sessions/${currentSessionId}/messages`);
                if (!response.ok) {
                    throw new Error('Failed to load messages');
                }

                const data = await response.json();
                renderMessages(data.messages);
                updateMessageCount(data.total_count);
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Render messages
        function renderMessages(messages) {
            const container = document.getElementById('chatContent');
            container.innerHTML = '<div class="chat-messages" id="messageList"></div>';

            const list = document.getElementById('messageList');
            messages.forEach(msg => {
                appendMessage(msg.role, msg.content, msg.timestamp);
            });

            scrollToBottom();
        }

        // Append single message
        function appendMessage(role, content, timestamp) {
            const list = document.getElementById('messageList');
            if (!list) return;

            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="message-bubble">${escapeHtml(content)}</div>
                <div class="message-meta">${formatTime(timestamp)}</div>
            `;
            list.appendChild(div);
            scrollToBottom();
        }

        // Connect WebSocket
        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat?session_id=${currentSessionId}&token=web_user`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onclose = () => {
                updateStatus(false);
                // Reset processing state when connection drops
                isProcessing = false;
                updateSendButton();
                hideTypingIndicator();
                finalizeStreaming();
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus(false);
                // Reset processing state on error
                isProcessing = false;
                updateSendButton();
                hideTypingIndicator();
                finalizeStreaming();
            };
        }

        // Streaming state
        let streamingElement = null;
        let streamingContent = '';

        // Handle WebSocket message
        function handleWebSocketMessage(data) {
            if (data.type === 'error') {
                finalizeStreaming();
                appendMessage('system', `错误: ${data.content}`, new Date().toISOString());
                isProcessing = false;
                updateSendButton();
                hideTypingIndicator();
                return;
            }

            if (data.type === 'text_token') {
                // Streaming token - accumulate and display incrementally
                if (!streamingElement) {
                    hideTypingIndicator();
                    streamingElement = createStreamingMessage();
                }
                streamingContent += data.content;
                updateStreamingContent(streamingElement, streamingContent);
                return;
            }

            if (data.type === 'final_answer' || data.type === 'response') {
                finalizeStreaming();
                appendMessage('assistant', data.content, data.timestamp);
                isProcessing = false;
                updateSendButton();
                hideTypingIndicator();
            } else if (data.type === 'thought') {
                console.log('Agent thinking:', data.content);
            } else if (data.type === 'action') {
                console.log('Agent action:', data.content);
            } else if (data.type === 'observation') {
                console.log('Observation:', data.content);
            }
        }

        // Create a streaming message element
        function createStreamingMessage() {
            const list = document.getElementById('messageList');
            if (!list) return null;

            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'streamingMessage';
            div.innerHTML = `
                <div class="message-bubble" id="streamingBubble"></div>
                <div class="message-meta">正在输入...</div>
            `;
            list.appendChild(div);
            scrollToBottom();
            return div;
        }

        // Update streaming content in the message bubble
        function updateStreamingContent(element, content) {
            if (!element) return;
            const bubble = element.querySelector('.message-bubble');
            if (bubble) {
                bubble.textContent = content;
                scrollToBottom();
            }
        }

        // Finalize streaming message - remove or convert to regular message
        function finalizeStreaming() {
            if (streamingElement) {
                // Remove the streaming element; the final_answer will replace it
                streamingElement.remove();
                streamingElement = null;
                streamingContent = '';
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !currentSessionId || isProcessing) return;

            // Clear input
            input.value = '';

            // Show user message
            appendMessage('user', content, new Date().toISOString());

            // Show typing indicator
            showTypingIndicator();

            // Set processing state
            isProcessing = true;
            updateSendButton();

            // Send via WebSocket
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'user_message',
                    content: content
                }));
            } else {
                // Fallback to REST API
                try {
                    const response = await fetch(`${API_BASE}/sessions/${currentSessionId}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: content,
                            sender_id: 'web_user'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to send message');
                    }

                    const data = await response.json();
                    data.events.forEach(event => {
                        if (event.type === 'final_answer' || event.type === 'response') {
                            appendMessage('assistant', event.content, event.timestamp);
                        }
                    });
                } catch (error) {
                    console.error('Error sending message:', error);
                    appendMessage('system', '发送失败: ' + error.message, new Date().toISOString());
                } finally {
                    isProcessing = false;
                    updateSendButton();
                    hideTypingIndicator();
                }
            }
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // UI Helpers
        function scrollToBottom() {
            const list = document.getElementById('messageList');
            if (list) {
                list.scrollTop = list.scrollHeight;
            }
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = `status-dot ${connected ? 'connected' : 'disconnected'}`;
            text.textContent = connected ? '已连接' : '未连接';
        }

        function updateMessageCount(count) {
            document.getElementById('messageCount').textContent = `${count} 条消息`;
        }

        function updateSendButton() {
            const btn = document.getElementById('sendBtn');
            btn.disabled = isProcessing;
            btn.textContent = isProcessing ? '处理中...' : '发送';
        }

        function showTypingIndicator() {
            let indicator = document.getElementById('typingIndicator');
            if (!indicator) {
                const list = document.getElementById('messageList');
                indicator = document.createElement('div');
                indicator.id = 'typingIndicator';
                indicator.className = 'message assistant';
                indicator.innerHTML = `
                    <div class="typing-indicator active">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
                list.appendChild(indicator);
            }
            indicator.style.display = 'flex';
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
