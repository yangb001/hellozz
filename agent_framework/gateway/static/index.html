<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Framework</title>
    <link rel="stylesheet" href="/static/css/thinking.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #34495e;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .new-session-btn {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-session-btn:hover {
            background: #2980b9;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-item:hover {
            background: #34495e;
        }

        .session-item.active {
            background: #3498db;
        }

        .session-item .session-id {
            font-size: 13px;
            opacity: 0.8;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-item .session-time {
            font-size: 11px;
            opacity: 0.6;
        }

        /* Main Chat Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        #chatContent {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .chat-header {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 16px;
            color: #333;
        }

        .chat-header .session-info {
            font-size: 12px;
            color: #666;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            min-height: 0;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #3498db;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 4px;
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #3498db;
        }

        .send-btn {
            padding: 12px 24px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #2980b9;
        }

        .send-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            min-height: 0;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* Loading Indicator */
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            max-width: 70%;
        }

        .typing-indicator.active {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Status Bar */
        .status-bar {
            padding: 8px 20px;
            background: #ecf0f1;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-dot.connected { background: #2ecc71; }
        .status-dot.disconnected { background: #e74c3c; }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        /* Tool Call Message */
        .tool-call-message {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            max-width: 85%;
        }

        .tool-call-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .tool-call-icon {
            font-size: 16px;
        }

        .tool-call-name {
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }

        .tool-call-arguments {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            color: #212529;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Reasoning Message */
        .reasoning-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            max-width: 85%;
        }

        .reasoning-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .reasoning-icon {
            font-size: 16px;
        }

        .reasoning-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 500;
        }

        .reasoning-content {
            color: white;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>AI Agent</h1>
            <button class="new-session-btn" onclick="createSession()">+ 新建会话</button>
        </div>
        <div class="session-list" id="sessionList">
            <!-- Sessions will be added here -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main">
        <div class="chat-header" id="chatHeader" style="display: none;">
            <h2 id="sessionTitle">会话</h2>
            <span class="session-info" id="sessionInfo"></span>
        </div>

        <div id="chatContent">
            <div id="thinking-container"></div>
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                </svg>
                <p>选择或创建一个会话开始对话</p>
            </div>
        </div>

        <div class="input-area" id="inputArea" style="display: none;">
            <div class="input-container">
                <input type="text" class="message-input" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <span><span class="status-dot disconnected" id="statusDot"></span><span id="statusText">未连接</span></span>
            <span id="messageCount">0 条消息</span>
        </div>
    </div>

    <script src="/static/js/thinking.js"></script>
    <script>
        // State
        let currentSessionId = null;
        let sessions = [];
        let ws = null;
        let isProcessing = false;

        // API Base URL
        const API_BASE = '/api/v1';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSessions();
        });

        // Load sessions from server (we'll store them locally for now)
        async function loadSessions() {
            // In a real app, we'd have a list sessions endpoint
            // For now, we'll use local storage
            const saved = localStorage.getItem('sessions');
            if (saved) {
                sessions = JSON.parse(saved);
                renderSessionList();
            }
        }

        // Save sessions to local storage
        function saveSessions() {
            localStorage.setItem('sessions', JSON.stringify(sessions));
        }

        // Create new session
        async function createSession() {
            try {
                const response = await fetch(`${API_BASE}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 'web_user',
                        session_type: 'private'
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to create session');
                }

                const data = await response.json();
                const session = {
                    id: data.session_id,
                    created_at: data.created_at,
                    type: data.session_type
                };

                sessions.unshift(session);
                saveSessions();
                renderSessionList();
                selectSession(session.id);
            } catch (error) {
                console.error('Error creating session:', error);
                alert('创建会话失败: ' + error.message);
            }
        }

        // Render session list
        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = sessions.map(session => `
                <div class="session-item ${session.id === currentSessionId ? 'active' : ''}"
                     onclick="selectSession('${session.id}')">
                    <span class="session-id">${session.id.substring(0, 8)}...</span>
                    <span class="session-time">${formatTime(session.created_at)}</span>
                </div>
            `).join('');
        }

        // Select session
        async function selectSession(sessionId) {
            currentSessionId = sessionId;

            // Reset processing state when switching sessions
            isProcessing = false;
            updateSendButton();
            hideTypingIndicator();
            finalizeStreaming();
            streamingContentPreserved = '';

            // Clear thinking component
            if (thinkingComponent) {
                thinkingComponent.clear();
            }

            // Update UI
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'block';
            document.getElementById('sessionTitle').textContent = `会话 ${sessionId.substring(0, 8)}`;

            renderSessionList();
            await loadMessages();
            connectWebSocket();
        }

        // Load message history
        async function loadMessages() {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`${API_BASE}/sessions/${currentSessionId}/messages`);
                if (!response.ok) {
                    throw new Error('Failed to load messages');
                }

                const data = await response.json();
                renderMessages(data.messages);
                updateMessageCount(data.total_count);
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Render messages
        function renderMessages(messages) {
            const container = document.getElementById('chatContent');
            container.innerHTML = '<div id="thinking-container"></div><div class="chat-messages" id="messageList"></div>';

            const list = document.getElementById('messageList');
            messages.forEach(msg => {
                appendMessage(msg.role, msg.content, msg.timestamp);
            });

            // Re-initialize thinking component with new container
            thinkingComponent = new ThinkingComponent('thinking-container');

            scrollToBottom();
        }

        // Append single message
        function appendMessage(role, content, timestamp) {
            const list = document.getElementById('messageList');
            if (!list) return;

            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="message-bubble">${escapeHtml(content)}</div>
                <div class="message-meta">${formatTime(timestamp)}</div>
            `;
            list.appendChild(div);
            scrollToBottom();
        }

        // Connect WebSocket
        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat?session_id=${currentSessionId}&token=web_user`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.debug('[WS Client] WebSocket connected');
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                console.debug('[WS Client] RECEIVED from server:', event.data);
                const data = JSON.parse(event.data);
                console.debug('[WS Client] Parsed message:', { type: data.type, content_len: data.content ? data.content.length : 0 });
                handleWebSocketMessage(data);
            };

            ws.onclose = () => {
                updateStatus(false);
                // Use handleStreamEnd to show accumulated content if connection drops
                // before final_answer arrived. If final_answer was already processed,
                // this is a no-op (preserved content is empty).
                handleStreamEnd();
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus(false);
                // Use handleStreamEnd to show accumulated content on error.
                handleStreamEnd();
            };
        }

        // Streaming state
        let streamingElement = null;
        let streamingContent = '';
        let streamingContentPreserved = '';
        let reasoningElement = null;
        let reasoningContent = '';
        let currentToolCall = null;
        let toolCallElement = null;

        // Handle stream end - unified logic for WebSocket close/error only
        // This is a safety net: if the connection drops before final_answer arrives,
        // we still show whatever content was accumulated during streaming.
        function handleStreamEnd() {
            const preservedContent = streamingContentPreserved || streamingContent;
            finalizeStreaming();
            finalizeReasoning();
            if (preservedContent) {
                appendMessage('assistant', preservedContent, new Date().toISOString());
            }
            isProcessing = false;
            updateSendButton();
            hideTypingIndicator();
        }

        // Handle streaming_end event from backend - just finalize the streaming element
        // without adding a message. The final_answer event will add the message.
        function handleStreamingEndEvent() {
            finalizeStreaming();
            finalizeReasoning();
        }

        // Handle WebSocket message
        function handleWebSocketMessage(data) {
            console.debug('[WS Client] handleWebSocketMessage called with type:', data.type);

            // Handle thinking events
            if (data.type && data.type.startsWith('thinking_')) {
                handleThinkingEvent(data);
                return;
            }

            if (data.type === 'error') {
                finalizeStreaming();
                appendMessage('system', `错误: ${data.content}`, new Date().toISOString());
                isProcessing = false;
                updateSendButton();
                hideTypingIndicator();
                return;
            }

            if (data.type === 'text_token') {
                // Streaming token - accumulate and display incrementally
                console.debug('[WS Client] text_token received:', data.content);
                if (!streamingElement) {
                    console.debug('[WS Client] Creating new streaming element');
                    hideTypingIndicator();
                    streamingElement = createStreamingMessage();
                }
                streamingContent += data.content;
                console.debug('[WS Client] streamingContent length:', streamingContent.length);
                updateStreamingContent(streamingElement, streamingContent);
                return;
            }

            if (data.type === 'final_answer' || data.type === 'response') {
                finalizeStreaming();
                finalizeReasoning();
                // Use preserved streaming content if available, otherwise use data.content
                const finalContent = streamingContentPreserved || data.content;
                streamingContentPreserved = ''; // Clear preserved content
                appendMessage('assistant', finalContent, data.timestamp);
                isProcessing = false;
                updateSendButton();
                hideTypingIndicator();
                return;
            }

            if (data.type === 'streaming_end' || data.type === 'done') {
                // Do NOT add a message here. Just finalize the streaming element
                // (preserving its content). The final_answer event will add the message.
                // This prevents duplicate messages when streaming_end arrives before final_answer.
                console.debug('[WS Client] Stream end received, preserving content for final_answer');
                handleStreamingEndEvent();
                return;
            }

            if (data.type === 'thought') {
                console.log('Agent thinking:', data.content);
            } else if (data.type === 'action') {
                console.log('Agent action:', data.content);
            } else if (data.type === 'observation') {
                console.log('Observation:', data.content);
            } else if (data.type === 'reasoning_content') {
                appendReasoningContent(data.content);
            } else if (data.type === 'tool_call_start') {
                currentToolCall = {
                    id: data.metadata?.tool_call_id || data.tool_call_id || '',
                    name: data.metadata?.tool_name || data.tool_name || '',
                    arguments: ''
                };
                toolCallElement = createToolCallElement(currentToolCall.name);
            } else if (data.type === 'tool_call_argument') {
                if (currentToolCall) {
                    // The backend sends FULL accumulated arguments each time,
                    // so REPLACE (not append) to avoid duplication.
                    // Fall back to metadata.arguments_fragment for compatibility.
                    const newArgs = data.content || data.metadata?.arguments_fragment || '';
                    if (newArgs) {
                        currentToolCall.arguments = newArgs;
                    }
                }
            } else if (data.type === 'tool_call_end') {
                if (toolCallElement) {
                    updateToolCallElement(toolCallElement, currentToolCall);
                    toolCallElement = null;
                    currentToolCall = null;
                }
            }
        }

        // Create a streaming message element
        function createStreamingMessage() {
            const list = document.getElementById('messageList');
            if (!list) return null;

            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'streamingMessage';
            div.innerHTML = `
                <div class="message-bubble" id="streamingBubble"></div>
                <div class="message-meta">正在输入...</div>
            `;
            list.appendChild(div);
            scrollToBottom();
            return div;
        }

        // Update streaming content in the message bubble
        function updateStreamingContent(element, content) {
            if (!element) return;
            const bubble = element.querySelector('.message-bubble');
            if (bubble) {
                bubble.textContent = content;
                scrollToBottom();
            }
        }

        // Finalize streaming message - preserve content before removing
        function finalizeStreaming() {
            if (streamingElement) {
                const bubble = streamingElement.querySelector('.message-bubble');
                if (bubble) {
                    streamingContentPreserved = bubble.textContent || streamingContent;
                }
                streamingElement.remove();
                streamingElement = null;
                streamingContent = '';
            }
        }

        // Create a tool call element
        function createToolCallElement(toolName) {
            const list = document.getElementById('messageList');
            if (!list) return null;

            const div = document.createElement('div');
            div.className = 'message assistant tool-call-message';
            div.innerHTML = `
                <div class="tool-call-header">
                    <span class="tool-call-icon">🔧</span>
                    <span class="tool-call-name">${escapeHtml(toolName)}</span>
                </div>
                <div class="tool-call-arguments" id="toolCallArgs"></div>
            `;
            list.appendChild(div);
            scrollToBottom();
            return div;
        }

        // Update tool call element with arguments
        function updateToolCallElement(element, toolCall) {
            if (!element) return;
            const argsDiv = element.querySelector('.tool-call-arguments');
            if (argsDiv) {
                argsDiv.textContent = toolCall.arguments;
            }
        }

        // Append reasoning content
        function appendReasoningContent(content) {
            const list = document.getElementById('messageList');
            if (!list) return;

            if (!reasoningElement) {
                hideTypingIndicator();
                reasoningElement = document.createElement('div');
                reasoningElement.className = 'message assistant reasoning-message';
                reasoningElement.innerHTML = `
                    <div class="reasoning-header">
                        <span class="reasoning-icon">🤔</span>
                        <span class="reasoning-label">思考中...</span>
                    </div>
                    <div class="reasoning-content" id="reasoningContent"></div>
                `;
                list.appendChild(reasoningElement);
            }

            reasoningContent += content;
            const contentDiv = reasoningElement.querySelector('.reasoning-content');
            if (contentDiv) {
                contentDiv.textContent = reasoningContent;
                scrollToBottom();
            }
        }

        // Finalize reasoning message
        function finalizeReasoning() {
            if (reasoningElement) {
                reasoningElement.remove();
                reasoningElement = null;
                reasoningContent = '';
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !currentSessionId || isProcessing) return;

            // Clear input
            input.value = '';

            // Show user message
            appendMessage('user', content, new Date().toISOString());

            // Show typing indicator
            showTypingIndicator();

            // Set processing state
            isProcessing = true;
            updateSendButton();

            // Send via WebSocket
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    type: 'user_message',
                    content: content
                };
                console.debug('[WS Client] SENDING to server:', msg);
                ws.send(JSON.stringify(msg));
            } else {
                // Fallback to REST API with SSE streaming
                console.debug('[REST Client] WebSocket not available, using REST fallback');
                try {
                    const response = await fetch(`${API_BASE}/sessions/${currentSessionId}/messages/stream`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: content,
                            sender_id: 'web_user'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to send message');
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.slice(6);
                                if (dataStr === '[DONE]' || dataStr === '[DONE]\r') {
                                    console.debug('[SSE Client] Received [DONE]');
                                    continue;
                                }
                                try {
                                    const data = JSON.parse(dataStr);
                                    console.debug('[SSE Client] Received:', data);
                                    console.debug('[SSE Client] data.type:', data.type, 'data.content:', data.content);
                                    // For done/streaming_end in SSE, just finalize streaming element
                                    // without adding message. The final_answer event handles message display.
                                    // The 'done' signal from REST endpoint is handled after the loop.
                                    if (data.type === 'done' || data.type === 'streaming_end') {
                                        console.debug('[SSE Client] Received stream end signal, preserving content');
                                        handleStreamingEndEvent();
                                        continue;
                                    }
                                    handleWebSocketMessage(data);
                                } catch (e) {
                                    console.debug('SSE parse error:', e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error sending message:', error);
                    // Clean up streaming state without adding a message
                    finalizeStreaming();
                    streamingContentPreserved = ''; // Clear so handleStreamEnd won't duplicate
                    appendMessage('system', '发送失败: ' + error.message, new Date().toISOString());
                    isProcessing = false;
                    updateSendButton();
                    hideTypingIndicator();
                } finally {
                    // Safety net: if final_answer was never received (e.g., stream ended
                    // abnormally without error), use handleStreamEnd to show whatever
                    // content was accumulated. If final_answer already handled everything,
                    // preservedContent will be empty and this is a no-op.
                    handleStreamEnd();
                }
            }
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // UI Helpers
        function scrollToBottom() {
            const list = document.getElementById('messageList');
            if (list) {
                list.scrollTop = list.scrollHeight;
            }
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = `status-dot ${connected ? 'connected' : 'disconnected'}`;
            text.textContent = connected ? '已连接' : '未连接';
        }

        function updateMessageCount(count) {
            document.getElementById('messageCount').textContent = `${count} 条消息`;
        }

        function updateSendButton() {
            const btn = document.getElementById('sendBtn');
            btn.disabled = isProcessing;
            btn.textContent = isProcessing ? '处理中...' : '发送';
        }

        function showTypingIndicator() {
            let indicator = document.getElementById('typingIndicator');
            if (!indicator) {
                const list = document.getElementById('messageList');
                indicator = document.createElement('div');
                indicator.id = 'typingIndicator';
                indicator.className = 'message assistant';
                indicator.innerHTML = `
                    <div class="typing-indicator active">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
                list.appendChild(indicator);
            }
            indicator.style.display = 'flex';
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
